services:

  # ==========================================
  # Jenkins
  # ==========================================
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile

    image: devops-jenkins:1.0
    container_name: jenkins
    restart: unless-stopped

    ports:
      - "8080:8080"
      - "50000:50000"

    # Set the GID of the Docker group on the host machine to allow Jenkins to access the Docker daemon
    group_add:
    - "${DOCKER_GID}"

    volumes:
      - jenkins_data:/var/jenkins_home

      # Mount the Docker socket to allow Jenkins to communicate with the Docker daemon on the host machine
      - /var/run/docker.sock:/var/run/docker.sock

      # Mount the kubeconfig file to allow Jenkins to access the Kubernetes cluster
      - ./jenkins-kubeconfig:/var/jenkins_home/.kube/config:ro

    networks:
      - cicd_network
      - kind

    # Add extra_hosts to allow Jenkins to resolve host.docker.internal to the host machine's gateway
    extra_hosts:
      - "host.docker.internal:host-gateway"


  # ==========================================
  # SonarQube
  # ==========================================
  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    restart: unless-stopped

    ports:
      - "9000:9000"

    # Set the JDBC connection details for SonarQube to connect to the PostgreSQL database
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube_db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonarpass

    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

    depends_on:
      sonarqube_db:
        condition: service_healthy

    networks:
      - cicd_network

    ulimits:
      nofile:
        soft: 65536
        hard: 65536


  # ==========================================
  # SonarQube Database (PostgreSQL)
  # ==========================================
  sonarqube_db:
    image: postgres:17-alpine
    container_name: sonarqube_db
    restart: unless-stopped

    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonarpass
      POSTGRES_DB: sonarqube

    volumes:
      - sonarqube_db_data:/var/lib/postgresql/data

    networks:
      - cicd_network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonarqube"]
      interval: 10s
      timeout: 5s
      retries: 10


  # ==========================================
  # Nexus Repository
  # ==========================================
  nexus:
    image: sonatype/nexus3:3.87.2
    container_name: nexus
    restart: unless-stopped

    ports:
      - "8081:8081"

    volumes:
      - nexus_data:/nexus-data

    networks:
      - cicd_network


# ==========================================
# Persistent Volumes
# ==========================================
volumes:

  jenkins_data:
    name: jenkins_data

  sonarqube_data:
    name: sonarqube_data

  sonarqube_extensions:
    name: sonarqube_extensions

  sonarqube_logs:
    name: sonarqube_logs

  sonarqube_db_data:
    name: sonarqube_db_data

  nexus_data:
    name: nexus_data


# ==========================================
# Network
# ==========================================
networks:
  cicd_network:
       external: true

  kind:
    external: true
