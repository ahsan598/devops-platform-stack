deploymentMode: SingleBinary

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  storage:
    type: filesystem
    bucketNames:
      chunks: chunks
      ruler: ruler
      admin: admin

# Single instance StatefulSet configuration
singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 10Gi

# Disable SimpleScalable targets
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

# Disable cache & microservices
chunksCache:
  enabled: false
resultsCache:
  enabled: false

gateway:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false